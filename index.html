<!DOCTYPE html>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css?v=20260711a">
  <link rel="stylesheet" href="css/base.css?v=20260711a">
  <link rel="stylesheet" href="css/layout.css?v=20260711a">
  <link rel="stylesheet" href="css/components.css?v=20260711a">
  <link rel="stylesheet" href="css/pages/daily.css?v=20260711a">
  <link rel="stylesheet" href="css/pages/weekly.css?v=20260711a">
  <link rel="stylesheet" href="css/pages/monthly.css?v=20260711a">
  <link rel="stylesheet" href="css/pages/yearly.css?v=20260711a">
  <link rel="stylesheet" href="css/pages/operations.css?v=20260711a">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <a href="#home" class="logo">
          🌾 <span>复盘</span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="main-nav" aria-label="主导航">
          <a href="#home" class="nav-link active" data-route="home">Home</a>
          <a href="#daily" class="nav-link" data-route="daily">Daily</a>
          <a href="#weekly" class="nav-link" data-route="weekly">Weekly</a>
          <a href="#monthly" class="nav-link" data-route="monthly">Monthly</a>
          <a href="#yearly" class="nav-link" data-route="yearly">Yearly</a>
          <a href="#records" class="nav-link" data-route="records">Records</a>
          <a href="#projects" class="nav-link" data-route="projects">Projects</a>
          <a href="#diary" class="nav-link" data-route="diary">Diary</a>
          <a href="#content" class="nav-link" data-route="content">Content</a>
        </nav>

        <div class="auth-controls" id="auth-controls" aria-live="polite"></div>

        <!-- Mobile Menu Toggle -->
        <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Mobile Navigation -->
      <nav class="mobile-menu" aria-label="移动端导航">
        <a href="#home" class="nav-link active" data-route="home">Home</a>
        <a href="#daily" class="nav-link" data-route="daily">Daily</a>
        <a href="#weekly" class="nav-link" data-route="weekly">Weekly</a>
        <a href="#monthly" class="nav-link" data-route="monthly">Monthly</a>
        <a href="#yearly" class="nav-link" data-route="yearly">Yearly</a>
        <a href="#records" class="nav-link" data-route="records">Records</a>
        <a href="#projects" class="nav-link" data-route="projects">Projects</a>
        <a href="#diary" class="nav-link" data-route="diary">Diary</a>
        <a href="#content" class="nav-link" data-route="content">Content</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Content rendered by JS -->
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>© 2026 <a href="#home">复盘</a> · 用 <a href="https://github.com/Simidas/summary-dashboard" target="_blank" rel="noopener">OpenClaw</a> 构建</p>
      <p class="deploy-time" id="deploy-time"></p>
    </footer>
  </div>

  <!-- App Script -->
  <script type="module" src="js/app.js?v=20260711a"></script>

  <!-- Deploy time indicator -->
  <script>
    (function() {
      const el = document.getElementById('deploy-time');
      if (el) {
        const commitTime = 'COMMIT_TIME_PLACEHOLDER';
        if (!commitTime.includes('PLACEHOLDER')) {
          const date = new Date(commitTime);
          if (!Number.isNaN(date.getTime())) {
            const parts = new Intl.DateTimeFormat('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            }).formatToParts(date);
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            el.textContent = '部署时间：' + values.year + '-' + values.month + '-' + values.day + ' ' + values.hour + ':' + values.minute;
          }
        }
      }
    })();
  </script>
</body>
</html>
