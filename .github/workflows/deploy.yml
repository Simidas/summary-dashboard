name: Build and Deploy

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/records/**'
      - 'data/summaries/**'
      - 'data/legacy/**'
      - 'scripts/**'
      - 'templates/**'
      - 'src/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  aggregate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run aggregation script
        run: node scripts/aggregate.js

      - name: Prepare Worker assets
        run: node scripts/prepare-worker-assets.js

      - name: Configure git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data/records/daily/manifest.json data/summaries/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            git commit -m "chore: update summary data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "Pushed updated summary data"
          fi

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
